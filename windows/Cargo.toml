[package]
name = "cs2-coinflip"
version = "1.2.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
